[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./totem.log"
file_size_limit = 0
syslog_network = "unixgram"
syslog_address = "/dev/log"
syslog_encoding = "local"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0

[store]
type = "memory"

[store.memory]

[store.sqlite]
file = "./totem.db"

[notify]
mattermost_url = ""
mattermost_token = ""
arrival_notification = ":robot_face: {{.Location}} :arrow_right::house: {{.User}} arrived"
departure_notification = ":robot_face: {{.Location}} :house::arrow_right: {{.User}} has left"
pulse_notification = ":robot_face: [{{.Agent}}→{{.Agent}}]: Pulse message: {{.Message}}"
