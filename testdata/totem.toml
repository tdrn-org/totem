[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./totem.log"
file_size_limit = 0
syslog_network = "tcp"
syslog_address = "localhost:601"
syslog_encoding = "rfc5424"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0

[store]
type = "sqlite"

[store.memory]

[store.sqlite]
file = "./totem.db"

[notify]
mattermost_url = "https://mattermost.mydomain.org"
mattermost_token = "secret_mattermost_token"
arrival_notification = "Hello {{.Agent}} I have arrived at {{.Location}}."
departure_notification = "Hello {{.Agent}} I am leaving and will be back soon."
pulse_notification = "Hello {{.Agent}} You have asked for the following message: '{{.Message}}'"

[[notify.profile]]
agent = "agent1"
presence = true

[[notify.schedule]]
agent = "agent1"
schedule = "5 * * * *"
notification = "Hello {{.Agent}}, check for new emails."

[notify.message.alert]
agent = "agent1"
message = "Hello {{.Agent}}, there is an alert."

[[location]]
id = "home1"
name = "Home 1"
address = "Address 1"
latitude = 1.1
longitude = 1.2
timezone = "Europe/Berlin"

[[location]]
id = "home2"
name = "Home 2"
address = "Address 2"
latitude = 2.1
longitude = 2.2
timezone = "America/New_York"

[[service.fritzbox]]
enabled = false
location_id = "home1"
device_url = "http://user:password@fritz.box:49000/"

[[service.huebridge]]
enabled = false
location_id = "home2"
address = "192.168.10.2"
bridge_id = "0123456789ABCDEF"
login = "abcdefgh"

[[service.jellyfin]]
enabled = false

[service.open_meteo]
enabled = false
