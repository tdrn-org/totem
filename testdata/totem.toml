[logging]
level = "info"
target = "stdout"
color = "auto"
file_name = "./totem.log"
file_size_limit = 0
syslog_network = "tcp"
syslog_address = "localhost:601"
syslog_encoding = "rfc5424"
syslog_facility = 4

[server]
address = "localhost:0"
protocol = "http"
cert_file = ""
key_file = ""
public_url = ""
trusted_proxies = [ ]
trusted_headers = [ ]
allowed_origins = [ ]
access_log = ""
access_log_size_limit = 0

[store]
type = "sqlite"

[store.memory]

[store.sqlite]
file = "./totem.db"

[[location]]
id = "home1"
name = "Home 1"
address = "Address 1"
latitude = 1.1
longitude = 1.2
timezone = "Europe/Berlin"

[[location]]
id = "home2"
name = "Home 2"
address = "Address 2"
latitude = 2.1
longitude = 2.2
timezone = "America/New_York"

[[service.fritzbox]]
